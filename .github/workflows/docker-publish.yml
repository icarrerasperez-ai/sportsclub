name: Docker-Publish

on:
  workflow_run:
    workflows: ["CI"] # El workflow anterior
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Solo se ejecuta si el workflow anterior se completo con exito
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sportsclub-app:latest
          file: ./docker/app/Dockerfile